name: Captura Automatica Capa Bronce (TDL E0)

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 12:00 UTC (06:00 AM CST Colima)
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  captura-bronce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar maquina de captura etica en Capa Bronce
        run: |
          python -m extractores.ejecutar_captura --modo diario

      - name: Verificar criterios e integridad de E0 y ejecutar pruebas unitarias
        run: |
          python -m pipeline.verificar_e0
          pytest -q

      - name: Registrar nuevos datos crudos y bitacora en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bronce/ calidad/bitacora_capturas.jsonl
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos que confirmar en esta corrida."
          else
            git commit -m "chore(bronce): captura automatica diaria y actualizacion de bitacora [skip ci]"
            git push
          fi
