name: CI Calidad, Puerta de Datos y Verificación E0-E2

on:
  push:
    branches: [ main ]
    tags: [ 'e*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-calidad:
    name: Puerta de Calidad, Pruebas Pytest y Verificadores E0-E2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Puerta de Calidad y Verificadores Deterministas (E0 + E1 + E2)
        run: |
          python -m pipeline.puerta_calidad
          python -m pipeline.verificar_e0
          python -m pipeline.verificar_e1
          python -m pipeline.verificar_e2

      - name: Ejecutar Suite Completa de Pruebas Automatizadas (E0 + E1 + E2)
        run: |
          pytest -v
